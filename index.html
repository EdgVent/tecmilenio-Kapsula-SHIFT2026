      <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: TOKENS.inkFaint, marginTop: 14 }}>
        Más ajustes próximamente.
      </p>
    </div>
  );
}

const LOGIN_USERS = [
  { id: "prof-1", email: "profesor@tecmilenio.mx", password: "kapsula2026", role: "profesor", nombre: "Prof. Martínez" },
  { id: "alum-1", email: "ana.torres@tecmilenio.mx", password: "kapsula2026", role: "alumno", nombre: "Ana Torres", carrera: "Comercio Internacional" },
];

function Login({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [entrando, setEntrando] = useState(false);

  const validarYEntrar = async (correo, contrasena) => {
    setError(null);
    setEntrando(true);
    await new Promise((r) => setTimeout(r, 250));
    const match = LOGIN_USERS.find(
      (u) =>
        u.email.toLowerCase() === String(correo || "").trim().toLowerCase() &&
        u.password.toLowerCase() === String(contrasena || "").trim().toLowerCase()
    );
    if (!match) {
      setError("Correo o contraseña incorrectos.");
      setEntrando(false);
      return;
    }
    // Guardamos la sesión para que sobreviva a un refresh, pero si el
    // almacenamiento local falla (por ejemplo, dentro de una vista
    // previa que lo bloquea), no dejamos al usuario atorado: lo dejamos
    // entrar de todas formas, solo que la sesión no persistirá.
    try {
      await dbPut("sesion", { key: "actual", userId: match.id });
    } catch (err) {
      console.warn("No se pudo guardar la sesión localmente:", err);
    }
    setEntrando(false);
    onLogin(match);
  };

  const intentarEntrar = (e) => {
    e.preventDefault();
    // Leemos directo de los campos del formulario, no solo del estado de
    // React: si el navegador autocompletó los campos, React no se entera
    // del cambio y el estado se quedaría vacío. Así funciona en ambos casos.
    const form = e.target;
    const correoReal = (form.elements.correo && form.elements.correo.value) || email;
    const passReal = (form.elements.contrasena && form.elements.contrasena.value) || password;
    validarYEntrar(correoReal, passReal);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", overflowY: "auto", padding: 32 }}>
      <img src={TECMILENIO_MARK} alt="Universidad Tecmilenio" style={{ height: 40, marginBottom: 18 }} />
      <div style={{ fontFamily: "'Sora', sans-serif", fontSize: 24, fontWeight: 700, color: TOKENS.ink, marginBottom: 4 }}>
        Kapsula
      </div>
      <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: TOKENS.inkSoft, marginBottom: 26 }}>
        Inicia sesión para continuar
      </div>

      <form onSubmit={intentarEntrar} style={{ width: "100%", maxWidth: 340 }}>
        <div style={{ marginBottom: 14 }}>
          <label style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: TOKENS.inkSoft, display: "block", marginBottom: 6 }}>
            Correo institucional
          </label>
          <input
            type="email"
            name="correo"
            autoComplete="off"
            required
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            placeholder="tucorreo@tecmilenio.mx"
            style={inputStyle}
          />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: TOKENS.inkSoft, display: "block", marginBottom: 6 }}>
            Contraseña
          </label>
          <input
            type="password"
            name="contrasena"
            autoComplete="new-password"
            required
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            placeholder="••••••••"
            style={inputStyle}
          />
        </div>

        {error && (
          <div
            style={{
              fontFamily: "'Inter', sans-serif",
              fontSize: 12,
              color: TOKENS.stamp,
              background: "#F6E9E5",
              border: `1px solid ${TOKENS.stamp}44`,
              borderRadius: 8,
              padding: "9px 12px",
              marginBottom: 14,
            }}
          >
            {error}
          </div>
        )}

        <button
          type="submit"
          disabled={entrando}
          style={{
            width: "100%",
            background: TOKENS.teal,
            color: TOKENS.white,
            border: "none",
            borderRadius: TOKENS.radiusButton,
            padding: "11px 20px",
            fontFamily: "'Inter', sans-serif",
            fontWeight: 600,
            fontSize: 13.5,
            cursor: entrando ? "default" : "pointer",
            opacity: entrando ? 0.7 : 1,
          }}
        >
          {entrando ? "Entrando…" : "Iniciar sesión"}
        </button>
      </form>

      <div
        style={{
          marginTop: 22,
          maxWidth: 340,
          width: "100%",
          background: TOKENS.paperDark,
          borderRadius: TOKENS.radiusCard,
          padding: 14,
        }}
      >
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, fontWeight: 600, color: TOKENS.inkSoft, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.05em" }}>
          Entrar con una cuenta de prueba
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {LOGIN_USERS.map((u) => (
            <button
              key={u.id}
              type="button"
              onClick={() => {
                setEmail(u.email);
                setPassword(u.password);
                setError(null);
                // Entra directo con estas credenciales, sin depender de
                // lo que el navegador haya puesto en los campos.
                validarYEntrar(u.email, u.password);
              }}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 8,
                background: TOKENS.white,
                border: `1px solid ${TOKENS.line}`,
                borderRadius: TOKENS.radiusControl,
                padding: "9px 12px",
                cursor: "pointer",
                textAlign: "left",
                width: "100%",
              }}
            >
              {u.role === "profesor" ? (
                <GraduationCap size={14} color={TOKENS.teal} style={{ flexShrink: 0 }} />
              ) : (
                <BookOpen size={14} color={TOKENS.teal} style={{ flexShrink: 0 }} />
              )}
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, fontWeight: 600, color: TOKENS.ink }}>
                {u.role === "profesor" ? "Profesor" : "Alumna"}
              </span>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11, color: TOKENS.inkFaint, marginLeft: "auto" }}>
                {u.nombre}
              </span>
            </button>
          ))}
        </div>
        <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 10.5, color: TOKENS.inkFaint, marginTop: 8, lineHeight: 1.5 }}>
          Da clic en una cuenta para entrar directo.
        </div>
      </div>

      <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 10.5, color: TOKENS.inkFaint, marginTop: 18, maxWidth: 340, textAlign: "center", lineHeight: 1.5 }}>
        Este login es una simulación con fines de demostración: valida contra una lista fija dentro del propio archivo, no contra un servidor seguro. Una autenticación real de producción requiere un backend.
      </p>
    </div>
  );
}

function KapsulaPrototype() {
  const [screen, setScreen] = useState("dashboard");
  const [videoData, setVideoData] = useState(null);
  const [darkMode, setDarkMode] = useState(false);
  const [session, setSession] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);

  const toggleDarkMode = () => {
    const next = !darkMode;
    Object.assign(TOKENS, next ? TOKENS_DARK : TOKENS_LIGHT);
    setDarkMode(next);
  };

  const revisarSesion = async () => {
    // La sesión NO se restaura automáticamente al abrir la app: siempre
    // se muestra la pantalla de login para poder elegir con qué cuenta
    // entrar (profesor o alumno). Los datos de cápsulas y evidencia sí
    // siguen guardados en el almacenamiento local entre sesiones.
    setCheckingSession(false);
  };

  useEffect(() => {
    revisarSesion();
  }, []);

  const handleLogin = (usuario) => {
    setSession(usuario);
    setScreen("dashboard");
  };

  const handleLogout = async () => {
    try {
      await dbDelete("sesion", "actual");
    } catch (err) {
      // Aunque falle borrar el registro local, igual cerramos la sesión
      // en la interfaz para que el usuario pueda volver a entrar.
    }
    setSession(null);
    setScreen("dashboard");
  };

  if (checkingSession) {
    return (
      <div
        className="ksp-shell"
        style={{
          fontFamily: "'Inter', sans-serif",
          background: TOKENS.paper,
          width: "100%",
          maxWidth: 1180,
          margin: "0 auto",
          height: "calc(100vh - 48px)",
          minHeight: 520,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          borderRadius: TOKENS.radiusCard,
          border: `1px solid ${TOKENS.line}`,
        }}
      >
        <style>{FONT_IMPORT}</style>
        <LoadingState label="Verificando sesión…" />
      </div>
    );
  }

  if (!session) {
    return (
      <div
        className="ksp-shell"
        style={{
          fontFamily: "'Inter', sans-serif",
          background: TOKENS.paper,
          width: "100%",
          maxWidth: 1180,
          margin: "0 auto",
          height: "calc(100vh - 48px)",
          minHeight: 520,
          borderRadius: TOKENS.radiusCard,
          overflow: "hidden",
          border: `1px solid ${TOKENS.line}`,
        }}
      >
        <style>{FONT_IMPORT}</style>
        <Login onLogin={handleLogin} />
      </div>
    );
  }

  return (
    <div
      className="ksp-shell"
      style={{
        fontFamily: "'Inter', sans-serif",
        background: TOKENS.paper,
        width: "100%",
        maxWidth: 1180,
        margin: "0 auto",
        height: "calc(100vh - 48px)",
        minHeight: 520,
        display: "flex",
        color: TOKENS.ink,
        borderRadius: TOKENS.radiusCard,
        overflow: "hidden",
        border: `1px solid ${TOKENS.line}`,
        position: "relative",
      }}
    >
      <style>{FONT_IMPORT}</style>
      <SideNav screen={screen} setScreen={setScreen} role={session.role} session={session} />
      <div style={{ flex: 1, minWidth: 0, overflowY: "auto", overflowX: "hidden" }}>
        {screen === "ajustes" ? (
          <Ajustes darkMode={darkMode} onToggleDarkMode={toggleDarkMode} session={session} onLogout={handleLogout} />
        ) : session.role === "alumno" ? (
          <StudentApp session={session} />
        ) : (
          <>
            {screen === "dashboard" && (
              <Dashboard goToWizard={() => setScreen("wizard")} onViewVideo={(c) => setVideoData(c)} />
            )}
            {screen === "wizard" && (
              <Wizard onFinish={() => setScreen("dashboard")} onViewVideo={(data) => setVideoData(data)} profesorNombre={session.nombre} />
            )}
            {screen === "indicadores" && <Indicadores />}
            {screen === "competencias" && <Competencias session={session} />}
            {screen === "ruta" && <RutaImplementacion />}
            {screen === "uso-ia" && <UsoIA />}
          </>
        )}
      </div>
      {videoData && <VideoPlayerModal data={videoData} onClose={() => setVideoData(null)} />}
    </div>
  );
}


createRoot(document.getElementById("root")).render(<KapsulaPrototype />);
</script>
</body>
</html>
