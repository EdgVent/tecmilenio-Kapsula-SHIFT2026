import React, { useState, useRef, useEffect } from "react";

// ============================================================
// Capa de persistencia local (IndexedDB) — sin backend externo.
// Los datos sobreviven a cerrar la pestaña, pero viven SOLO en
// este navegador/computadora, no se comparten entre dispositivos
// ni personas. Eso requeriría un backend real (ver documentación).
// ============================================================
const DB_NAME = "kapsula_db";
const DB_VERSION = 2;

function dbOpen() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === "undefined") {
      reject(new Error("Este navegador no soporta almacenamiento local (IndexedDB)."));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("capsulas")) db.createObjectStore("capsulas", { keyPath: "id" });
      if (!db.objectStoreNames.contains("evidencia")) db.createObjectStore("evidencia", { keyPath: "id" });
      if (!db.objectStoreNames.contains("sesion")) db.createObjectStore("sesion", { keyPath: "key" });
      // v2 — piezas que faltaban para acercarse a producción:
      // archivos reales, inscripciones y registro de visualización.
      if (!db.objectStoreNames.contains("archivos")) db.createObjectStore("archivos", { keyPath: "id" });
      if (!db.objectStoreNames.contains("inscripciones")) db.createObjectStore("inscripciones", { keyPath: "id" });
      if (!db.objectStoreNames.contains("visualizaciones")) db.createObjectStore("visualizaciones", { keyPath: "id" });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("No se pudo abrir el almacenamiento local."));
  });
}

async function dbGetAll(storeName) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(storeName, value) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).put(value);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function dbGetOne(storeName, key) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(storeName, key) {
  const db = await dbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

// Si el store está vacío (primera vez que se abre la app en este
// navegador), lo llena con los datos de ejemplo. Si ya tiene datos
// guardados de una sesión anterior, respeta esos y no los pisa.
async function dbSeedIfEmpty(storeName, seedArray) {
  const existing = await dbGetAll(storeName);
  if (existing.length > 0) return existing;
  const db = await dbOpen();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, "readwrite");
    const store = tx.objectStore(storeName);
    seedArray.forEach((item) => store.put(item));
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
  return seedArray;
}

// ============================================================
// Almacenamiento de archivos reales.
// El archivo se guarda completo (como Blob) en IndexedDB, no solo
// su nombre. En producción esta capa se sustituye por Supabase
// Storage: cambian estas tres funciones, no las pantallas.
// ============================================================
async function subirArchivo(file, meta = {}) {
  const registro = {
    id: `file-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    nombre: file.name,
    tipo: file.type,
    tamano: file.size,
    blob: file, // en Supabase Storage esto sería una ruta, no el archivo
    ...meta,
    _fecha: Date.now(),
  };
  await dbPut("archivos", registro);
  // Se devuelve sin el blob, igual que devolvería una API real:
  // solo el identificador y los metadatos.
  const { blob, ...sinBlob } = registro;
  return sinBlob;
}

async function obtenerUrlArchivo(archivoId) {
  const registro = await dbGetOne("archivos", archivoId);
  if (!registro || !registro.blob) return null;
  // URL temporal en memoria, equivalente a los enlaces firmados
  // y con expiración que emitiría Supabase Storage.
  return URL.createObjectURL(registro.blob);
}

async function eliminarArchivo(archivoId) {
  await dbDelete("archivos", archivoId);
}

// Componentes reutilizables de carga / error, para no repetir el
// mismo bloque en cada pantalla que lee de IndexedDB.
function LoadingState({ label = "Cargando…" }) {
  return (
    <div style={{ padding: "60px 44px", display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
      <RefreshCw size={20} color={TOKENS.teal} style={{ animation: "spin 1s linear infinite" }} />
      <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#64748B" }}>{label}</span>
      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}
function ErrorState({ message, onRetry }) {
  return (
    <div style={{ padding: "60px 44px", display: "flex", flexDirection: "column", alignItems: "center", gap: 12, textAlign: "center" }}>
      <AlertTriangle size={22} color="#B8763C" />
      <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: "#4B615A", maxWidth: 360 }}>{message}</span>
      <button
        onClick={onRetry}
        style={{
          background: "#12291F",
          color: "#fff",
          border: "none",
          borderRadius: 999,
          padding: "9px 18px",
          fontFamily: "'Inter', sans-serif",
          fontWeight: 600,
          fontSize: 12.5,
          cursor: "pointer",
        }}
      >
        Reintentar
      </button>
    </div>
  );
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}

// Calcula cuánto debe durar cada capítulo según la cantidad de texto,
// para que la narración nunca se corte a media frase. Antes todos los
// capítulos duraban lo mismo sin importar su longitud, lo que hacía
// que el guion se leyera apresurado.
function calcularTramos(chapters, rate = 1) {
  const PALABRAS_POR_SEGUNDO = 2.3 * (rate || 1);
  const duraciones = chapters.map((c) => {
    const palabras = String(c.caption || "").trim().split(/\s+/).filter(Boolean).length;
    // Un mínimo de 3.5s evita capítulos demasiado cortos, y se suma
    // una pausa de 0.9s al final de cada uno para que se sienta natural.
    return Math.max(3.5, palabras / PALABRAS_POR_SEGUNDO + 0.9);
  });
  const total = duraciones.reduce((a, b) => a + b, 0);
  let acumulado = 0;
  const limites = duraciones.map((d) => {
    acumulado += d;
    return acumulado;
  });
  return { duraciones, total, limites };
}

function capituloEn(limites, elapsed) {
  for (let i = 0; i < limites.length; i++) {
    if (elapsed < limites[i]) return i;
  }
  return limites.length - 1;
}

function VideoPlayerModal({ data, onClose }) {
  const REAL_DURATION = data?.realDuration || 372;
  // La duración de la vista previa ya no es fija: se calcula a partir
  // del texto real del guion, para que cada capítulo dure lo que
  // realmente toma leerlo en voz alta.
  const tramos = calcularTramos(
    (data && data.chapters) || [],
    (data && data.voz && data.voz.rate) || 1
  );
  const DEMO_SECONDS = tramos.total || 18;
  const [elapsed, setElapsed] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [voiceOn, setVoiceOn] = useState(true);
  const [medios, setMedios] = useState({}); // { Momento: { visualUrl, audioUrl } }
  const intervalRef = useRef(null);
  const audioRef = useRef(null);

  useEffect(() => {
    if (playing) {
      intervalRef.current = setInterval(() => {
        setElapsed((e) => {
          if (e >= DEMO_SECONDS) {
            setPlaying(false);
            return DEMO_SECONDS;
          }
          return e + 0.1;
        });
      }, 100);
    }
    return () => clearInterval(intervalRef.current);
  }, [playing]);

  // Carga los archivos reales que el profesor asignó a cada momento
  // en el editor de línea de tiempo.
  useEffect(() => {
    let cancelado = false;
    const urls = [];
    (async () => {
      const asign = (data && data.asignaciones) || {};
      const resultado = {};
      for (const momento of Object.keys(asign)) {
        const a = asign[momento] || {};
        const entrada = {};
        if (a.visualId) {
          const url = await obtenerUrlArchivo(a.visualId);
          const reg = await dbGetOne("archivos", a.visualId);
          if (url) {
            entrada.visualUrl = url;
            entrada.esVideo = !!(reg && String(reg.tipo || "").startsWith("video"));
            urls.push(url);
          }
        }
        if (a.audioId) {
          const url = await obtenerUrlArchivo(a.audioId);
          if (url) { entrada.audioUrl = url; urls.push(url); }
        }
        if (entrada.visualUrl || entrada.audioUrl) resultado[momento] = entrada;
      }
      if (!cancelado) setMedios(resultado);
    })();
    return () => {
      cancelado = true;
      urls.forEach((u) => URL.revokeObjectURL(u));
    };
  }, [data]);

  if (!data) return null;
  const { tema, materia, chapters } = data;
  const progressPct = (elapsed / DEMO_SECONDS) * 100;
  const chapterCount = chapters.length;
  const activeChapter = capituloEn(tramos.limites, elapsed);
  const displaySeconds = (elapsed / DEMO_SECONDS) * REAL_DURATION;
  const momentoActivo = chapters[activeChapter].label;
  const medioActivo = medios[momentoActivo] || {};

  // Reproduce el audio propio del profesor cuando ese momento lo tiene
  // asignado; en ese caso la narración sintética queda en silencio.
  useEffect(() => {
    const el = audioRef.current;
    if (!el) return;
    if (medioActivo.audioUrl && playing && voiceOn) {
      if (el.src !== medioActivo.audioUrl) el.src = medioActivo.audioUrl;
      el.play().catch(() => {});
    } else {
      el.pause();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [momentoActivo, playing, voiceOn, medioActivo.audioUrl]);

  useEffect(() => {
    // Si este momento tiene audio propio, no se superpone la voz sintética.
    if (medioActivo.audioUrl) {
      if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
      return;
    }
    if (!voiceOn || !playing || typeof window === "undefined" || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(chapters[activeChapter].caption);
    utter.lang = "es-MX";
    const vozCfg = data && data.voz;
    utter.rate = vozCfg && vozCfg.rate ? vozCfg.rate : 1;
    utter.pitch = vozCfg && vozCfg.pitch ? vozCfg.pitch : 1;
    const voice = pickSpeechVoice(vozCfg && typeof vozCfg.voiceIndex === "number" ? vozCfg.voiceIndex : 0);
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeChapter, voiceOn, playing, data, medioActivo.audioUrl]);

  const handleClose = () => {
    if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    if (audioRef.current) audioRef.current.pause();
    onClose();
  };

  const seek = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    setElapsed(pct * DEMO_SECONDS);
  };

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(30,42,61,0.72)",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        zIndex: 50,
        padding: 24,
      }}
      onClick={handleClose}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          background: TOKENS.paper,
          borderRadius: TOKENS.radiusCard,
          width: "100%",
          maxWidth: 620,
          border: `1px solid ${TOKENS.line}`,
          overflow: "hidden",
        }}
      >
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            padding: "14px 18px",
            borderBottom: `1px solid ${TOKENS.line}`,
          }}
        >
          <div>
            <div style={{ fontFamily: "'Sora', sans-serif", fontSize: 16, fontWeight: 600, color: TOKENS.ink }}>
              {tema}
            </div>
            <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: TOKENS.inkFaint }}>
              {materia}
            </div>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
            <button
              onClick={() => setVoiceOn((v) => !v)}
              title={voiceOn ? "Silenciar voz lectora" : "Activar voz lectora"}
              style={{ background: "transparent", border: "none", cursor: "pointer", color: voiceOn ? TOKENS.teal : TOKENS.inkFaint, padding: 4 }}
            >
              {voiceOn ? <Volume2 size={17} /> : <VolumeX size={17} />}
            </button>
            <button
              onClick={handleClose}
              style={{ background: "transparent", border: "none", cursor: "pointer", color: TOKENS.inkSoft, padding: 4 }}
            >
              <X size={18} />
            </button>
          </div>
        </div>

        <div
          style={{
            background: TOKENS.videoFrame,
            aspectRatio: "16/9",
            position: "relative",
            display: "flex",
            alignItems: "flex-end",
            justifyContent: "center",
            overflow: "hidden",
          }}
        >
          {medioActivo.visualUrl ? (
            medioActivo.esVideo ? (
              <video
                src={medioActivo.visualUrl}
                autoPlay
                muted
                loop
                playsInline
                style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
              />
            ) : (
              <img
                src={medioActivo.visualUrl}
                alt=""
                style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }}
              />
            )
          ) : null}
          <div
            style={{
              position: "absolute",
              top: 0,
              left: 0,
              right: 0,
              bottom: 0,
              background: medioActivo.visualUrl
                ? "linear-gradient(to top, rgba(18,41,31,0.75), rgba(18,41,31,0.15))"
                : "radial-gradient(circle at 30% 30%, rgba(14,59,92,0.30), transparent 55%), radial-gradient(circle at 75% 70%, rgba(31,122,69,0.30), transparent 55%)",
            }}
          />
          <audio ref={audioRef} style={{ display: "none" }} />
          <span
            style={{
              position: "absolute",
              top: 14,
              left: 16,
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 10.5,
              letterSpacing: "0.06em",
              textTransform: "uppercase",
              color: TOKENS.paper,
              opacity: 0.7,
            }}
          >
            Capítulo {activeChapter + 1}/{chapterCount} · {chapters[activeChapter].label}
          </span>

          <button
            onClick={() => setPlaying((p) => !p)}
            style={{
              position: "absolute",
              top: "50%",
              left: "50%",
              transform: "translate(-50%,-50%)",
              width: 60,
              height: 60,
              borderRadius: "50%",
              background: "rgba(251,249,243,0.94)",
              border: "none",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              cursor: "pointer",
            }}
          >
            {playing ? (
              <Pause size={22} color={TOKENS.ink} fill={TOKENS.ink} />
            ) : (
              <Play size={22} color={TOKENS.ink} fill={TOKENS.ink} style={{ marginLeft: 2 }} />
            )}
          </button>

          <div
            style={{
              position: "relative",
              zIndex: 1,
              width: "100%",
              padding: "0 20px 44px 20px",
              textAlign: "center",
            }}
          >
            <span
              style={{
                fontFamily: "'Inter', sans-serif",
                fontSize: 13.5,
                color: TOKENS.paper,
                background: "rgba(30,42,61,0.55)",
                padding: "6px 12px",
                borderRadius: 4,
                lineHeight: 1.4,
                display: "inline-block",
              }}
            >
              {chapters[activeChapter].caption}
            </span>
          </div>
        </div>

        <div style={{ padding: "12px 18px 18px 18px" }}>
          <div
            onClick={seek}
            style={{
              position: "relative",
              height: 6,
              borderRadius: 3,
              background: TOKENS.line,
              cursor: "pointer",
              marginBottom: 10,
            }}
          >
            {chapters.map((_, i) => (
              <div
                key={i}
                style={{
                  position: "absolute",
                  left: `${i === 0 ? 0 : (tramos.limites[i - 1] / DEMO_SECONDS) * 100}%`,
                  top: 0,
                  bottom: 0,
                  width: 2,
                  background: TOKENS.paper,
                  opacity: i === 0 ? 0 : 0.9,
                }}
              />
            ))}
            <div
              style={{
                position: "absolute",
                left: 0,
                top: 0,
                bottom: 0,
                width: `${progressPct}%`,
                background: TOKENS.teal,
                borderRadius: TOKENS.radiusButton,
              }}
            />
            <div
              style={{
                position: "absolute",
                left: `calc(${progressPct}% - 6px)`,
                top: -3,
                width: 12,
                height: 12,
                borderRadius: "50%",
                background: TOKENS.teal,
                border: `2px solid ${TOKENS.white}`,
              }}
            />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: TOKENS.inkSoft }}>
              {formatTime(displaySeconds)} / {formatTime(REAL_DURATION)}
            </span>
            <div style={{ display: "flex", gap: 6 }}>
              {chapters.map((c, i) => (
                <span
                  key={c.label}
                  style={{
                    fontFamily: "'JetBrains Mono', monospace",
                    fontSize: 9.5,
                    fontWeight: 600,
                    letterSpacing: "0.04em",
                    textTransform: "uppercase",

                    background: i === activeChapter ? TOKENS.ink : "transparent",
                    border: `1px solid ${i === activeChapter ? TOKENS.ink : TOKENS.line}`,
                  }}
                >
                  {c.label}
                </span>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function StudentPlayer({ capsula, onFinishVideo, onProgreso }) {
  // Igual que en el reproductor del profesor: la duración depende del
  // texto real del guion, no de un valor fijo.
  const tramos = calcularTramos(capsula.chapters || []);
  const DEMO_SECONDS = tramos.total || 16;
  const [elapsed, setElapsed] = useState(0);
  const [playing, setPlaying] = useState(true);
  const [voiceOn, setVoiceOn] = useState(true);
  const intervalRef = useRef(null);
  const maxVistoRef = useRef(0);

  useEffect(() => {
    if (playing) {
      intervalRef.current = setInterval(() => {
        setElapsed((e) => {
          if (e >= DEMO_SECONDS) {
            setPlaying(false);
            return DEMO_SECONDS;
          }
          return e + 0.1;
        });
      }, 100);
    }
    return () => clearInterval(intervalRef.current);
  }, [playing]);

  const progressPct = (elapsed / DEMO_SECONDS) * 100;
  const chapterCount = capsula.chapters.length;
  const activeChapter = capituloEn(tramos.limites, elapsed);
  const displaySeconds = (elapsed / DEMO_SECONDS) * capsula.realDuration;
  const canContinue = elapsed >= DEMO_SECONDS * 0.85;

  // Lleva el máximo porcentaje alcanzado y lo registra al salir de la
  // pantalla. Alimenta el indicador de consumo (distinto del aprendizaje).
  useEffect(() => {
    if (progressPct > maxVistoRef.current) maxVistoRef.current = progressPct;
  }, [progressPct]);

  useEffect(() => {
    return () => {
      if (onProgreso && maxVistoRef.current > 0) {
        onProgreso(capsula.id, Math.min(100, maxVistoRef.current));
      }
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (!voiceOn || !playing || typeof window === "undefined" || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(capsula.chapters[activeChapter].caption);
    utter.lang = "es-MX";
    utter.rate = 1;
    window.speechSynthesis.speak(utter);
    return () => {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeChapter, voiceOn, playing, capsula]);

  useEffect(() => {
    return () => {
      if (typeof window !== "undefined" && window.speechSynthesis) window.speechSynthesis.cancel();
    };
  }, []);

  const seek = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    setElapsed(pct * DEMO_SECONDS);
  };

  return (
    <div className="ksp-page" style={{ padding: "36px 44px", width: "100%", maxWidth: 940 }}>
      <div style={{ marginBottom: 18, display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div>
          <div style={{ fontFamily: "'Sora', sans-serif", fontSize: 20, fontWeight: 700, color: TOKENS.ink }}>
            {capsula.tema}
          </div>
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: TOKENS.inkFaint, marginTop: 2 }}>
            {capsula.profesor} · {capsula.duracion}
          </div>
        </div>
        <button
          onClick={() => setVoiceOn((v) => !v)}
          title={voiceOn ? "Silenciar voz lectora" : "Activar voz lectora"}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 6,
            background: voiceOn ? "#EAF2EF" : TOKENS.paperDark,
            border: `1px solid ${voiceOn ? TOKENS.teal : TOKENS.line}`,
            color: voiceOn ? TOKENS.teal : TOKENS.inkFaint,
            borderRadius: 6,
            padding: "6px 10px",
            fontFamily: "'Inter', sans-serif",
            fontSize: 11.5,
            fontWeight: 600,
            cursor: "pointer",
            flexShrink: 0,
          }}
        >
          {voiceOn ? <Volume2 size={14} /> : <VolumeX size={14} />}
          Voz
        </button>
      </div>

      <div style={{ background: TOKENS.videoFrame, borderRadius: TOKENS.radiusCard, aspectRatio: "16/9", position: "relative", overflow: "hidden", marginBottom: 12 }}>
        <div
          style={{
            position: "absolute",
            inset: 0,
            background:
              "radial-gradient(circle at 30% 30%, rgba(14,59,92,0.30), transparent 55%), radial-gradient(circle at 75% 70%, rgba(31,122,69,0.30), transparent 55%)",
          }}
        />
        <span style={{ position: "absolute", top: 14, left: 16, fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: "0.06em", textTransform: "uppercase", color: TOKENS.paper, opacity: 0.7 }}>
          Capítulo {activeChapter + 1}/{chapterCount} · {capsula.chapters[activeChapter].label}
        </span>
        <button
          onClick={() => setPlaying((p) => !p)}
          style={{
            position: "absolute",
            top: "50%",
            left: "50%",
            transform: "translate(-50%,-50%)",
            width: 58,
            height: 58,
            borderRadius: "50%",
            background: "rgba(252,253,252,0.94)",
            border: "none",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            cursor: "pointer",
          }}
        >
          {playing ? <Pause size={20} color={TOKENS.ink} fill={TOKENS.ink} /> : <Play size={20} color={TOKENS.ink} fill={TOKENS.ink} style={{ marginLeft: 2 }} />}
        </button>
        <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "0 18px 18px 18px", textAlign: "center" }}>
          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: TOKENS.paper, background: "rgba(18,41,31,0.55)", padding: "6px 12px", borderRadius: 4, display: "inline-block", lineHeight: 1.4 }}>
            {capsula.chapters[activeChapter].caption}
          </span>
        </div>
      </div>

      <div onClick={seek} style={{ position: "relative", height: 6, borderRadius: 3, background: TOKENS.line, cursor: "pointer", marginBottom: 8 }}>
        <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${progressPct}%`, background: TOKENS.teal, borderRadius: 3 }} />
        <div style={{ position: "absolute", left: `calc(${progressPct}% - 6px)`, top: -3, width: 12, height: 12, borderRadius: "50%", background: TOKENS.teal, border: `2px solid ${TOKENS.white}` }} />
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: TOKENS.inkSoft }}>
          {formatTime(displaySeconds)} / {formatTime(capsula.realDuration)}
        </span>
        {!canContinue && (
          <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: TOKENS.inkFaint }}>
            Termina el video para continuar a la actividad
          </span>
        )}
      </div>

      <button
        onClick={onFinishVideo}
        disabled={!canContinue}
        style={{
          display: "flex",
          alignItems: "center",
          gap: 8,
          background: canContinue ? TOKENS.ink : TOKENS.paperDark,
          color: canContinue ? TOKENS.paper : TOKENS.inkFaint,
          border: "none",
          borderRadius: 6,
          padding: "11px 20px",
          fontFamily: "'Inter', sans-serif",
          fontWeight: 600,
          fontSize: 13.5,
          cursor: canContinue ? "pointer" : "not-allowed",
        }}
      >
        Continuar a la actividad <ChevronRight size={15} />
      </button>
    </div>
  );
}

        capsulaId: capsula.id,

        capsula: capsula.tema,

      </div>

        onChange={(e) => setRespuesta(e.target.value)}
        placeholder="Escribe tu respuesta aquí…"

      {error && (
        <div
          style={{

function StudentApp({ session }) {
  const [screen, setScreen] = useState("home"); // home | curso | video | actividad | confirmacion
  const [materiaId, setMateriaId] = useState(null);
  const [capsula, setCapsula] = useState(null);
  const [evidencias, setEvidencias] = useState(null);
  const [misMaterias, setMisMaterias] = useState(null);
  const [capsulasPublicadas, setCapsulasPublicadas] = useState({});
  const [error, setError] = useState(null);

  const cargarDatos = async () => {
    setError(null);
    setEvidencias(null);
    setMisMaterias(null);
    try {
      const [todasEv, todasInsc, todasCaps] = await Promise.all([
        dbSeedIfEmpty("evidencia", EVIDENCE_LOG_SEED),
        dbSeedIfEmpty("inscripciones", INSCRIPCIONES_SEED),
        dbSeedIfEmpty("capsulas", CAPSULES_SEED),
      ]);
      setEvidencias(todasEv.filter((e) => e.alumno === session.nombre));
      // Solo las materias en las que este alumno está inscrito
      const idsInscritas = todasInsc
        .filter((i) => i.alumnoId === session.id)
        .map((i) => i.materiaId);
      setMisMaterias(STUDENT_MATERIAS.filter((m) => idsInscritas.includes(m.id)));

      // Cápsulas que los profesores publicaron y quedaron ligadas a una
      // materia del catálogo: se suman a las de ejemplo de esa materia.
      const publicadas = todasCaps.filter((c) => c.estado === "publicada" && c.materiaId);
      const porMateria = {};
      publicadas.forEach((c) => {
        if (!porMateria[c.materiaId]) porMateria[c.materiaId] = [];
        porMateria[c.materiaId].push({
          id: c.id,
          tema: c.tema,
          profesor: c.profesor || "Profesor",
          formato: c.formato,
          duracion: c.duracion,
          realDuration: c.realDuration,
          chapters: c.chapters || [],
          accion: c.accion || { prompt: "Resuelve el caso planteado al cierre y sube tu respuesta." },
          _publicada: true,
        });
      });
      setCapsulasPublicadas(porMateria);
    } catch (err) {
      setError("No se pudo cargar tu progreso. Intenta de nuevo.");
    }
  };

  const cargarEvidencias = cargarDatos;

  useEffect(() => {
    cargarDatos();
  }, []);

  const estaCompletada = (capsulaId) =>
    (evidencias || []).some((e) => e.capsulaId === capsulaId);

  // Une las cápsulas de ejemplo de cada materia con las que los
  // profesores publicaron y quedaron ligadas a esa misma materia.
  const capsulasDeMateria = (materiaKey) => {
    const base = STUDENT_CAPSULES_BY_MATERIA[materiaKey] || [];
    const publicadas = capsulasPublicadas[materiaKey] || [];
    // Las publicadas más recientes van primero.
    return [...publicadas, ...base];
  };

  const contarPendientes = (materiaKey) => {
    const lista = capsulasDeMateria(materiaKey);
    return lista.filter((c) => !estaCompletada(c.id)).length;
  };

  // Registra cuánto vio el alumno de una cápsula. Alimenta el indicador
  // de consumo, que se reporta por separado del aprendizaje.
  const registrarVisualizacion = async (capsulaId, pctVisto) => {
    try {
      await dbPut("visualizaciones", {
        id: `vis-${session.id}-${capsulaId}`,
        capsulaId,
        alumnoId: session.id,
        alumno: session.nombre,
        pctVisto: Math.round(pctVisto),
        _fecha: Date.now(),
      });
    } catch (err) {
      // El registro de consumo no debe bloquear la experiencia del alumno.
      console.warn("No se pudo registrar la visualización:", err);
    }
  };

  const openMateria = (id) => {
    setMateriaId(id);
    setScreen("curso");
  };
  const openCapsula = (c) => {
    setCapsula(c);
    setScreen("video");
  };
  const backHome = () => {
    setScreen("home");
    setMateriaId(null);
    setCapsula(null);
  };
  const onEvidenciaEnviada = async () => {
    await cargarEvidencias();
    setScreen("confirmacion");
  };

  if (evidencias === null && !error) {
    return <LoadingState label="Cargando tus materias…" />;
  }
  if (error) {
    return <ErrorState message={error} onRetry={cargarEvidencias} />;
  }

  if (screen === "curso")
    return <CourseDetail materiaId={materiaId} materias={misMaterias} capsulasDeMateria={capsulasDeMateria} onBack={backHome} onOpenCapsula={openCapsula} estaCompletada={estaCompletada} />;
  if (screen === "video")
    return <StudentPlayer capsula={capsula} onProgreso={registrarVisualizacion} onFinishVideo={() => setScreen("actividad")} />;
  if (screen === "actividad")
    return <StudentActividad capsula={capsula} alumno={session.nombre} onSubmit={onEvidenciaEnviada} />;
  if (screen === "confirmacion")
    return <StudentConfirmacion capsula={capsula} onDone={backHome} />;
  return <StudentHome onOpenMateria={openMateria} nombre={session.nombre} materias={misMaterias} contarPendientes={contarPendientes} />;
}

    setError(null);

    try {
      const data = await dbSeedIfEmpty("capsulas", CAPSULES_SEED);

      data.sort((a, b) => (b._creada || 0) - (a._creada || 0));

const STEPS = ["Objetivo", "Guion IA", "Recursos", "Ensamblaje", "Publicar"];

function Stepper({ step }) {
  return (
    <div className="ksp-stepper" style={{ display: "flex", alignItems: "center", marginBottom: 34 }}>
      {STEPS.map((s, i) => {
        const idx = i + 1;
        const active = idx === step;
        const done = idx < step;
        return (
          <div key={s} style={{ display: "flex", alignItems: "center", flex: i < STEPS.length - 1 ? 1 : "none" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <div
                style={{
                  width: 26,
                  height: 26,
                  borderRadius: "50%",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 11.5,
                  fontWeight: 600,
                  flexShrink: 0,
                  background: done ? TOKENS.teal : active ? TOKENS.ink : "transparent",
                  color: done || active ? TOKENS.white : TOKENS.inkFaint,
                  border: done || active ? "none" : `1.5px solid ${TOKENS.inkFaint}`,
                }}
              >
                {done ? <CheckCircle2 size={14} /> : idx}
              </div>
              <span
                className="ksp-stepper-label"
                style={{
                  fontFamily: "'Inter', sans-serif",
                  fontSize: 12.5,
                  fontWeight: active ? 600 : 500,
                  color: active ? TOKENS.ink : TOKENS.inkFaint,
                  whiteSpace: "nowrap",
                }}
              >
                {s}
              </span>
            </div>
            {i < STEPS.length - 1 && (
              <div style={{ flex: 1, height: 1, background: TOKENS.line, margin: "0 14px" }} />
            )}
          </div>
        );
      })}
    </div>
  );
}

const TIPO_ESCENA = {
  PRESENTADOR: { label: "Presentador", color: "#0E3B5C" },
  TITULO: { label: "Título", color: "#1F7A45" },
  DIAGRAMA: { label: "Diagrama", color: "#2DA546" },

  EJEMPLO: { label: "Ejemplo", color: "#6B4FA8" },
  CIERRE: { label: "Cierre", color: "#12291F" },
};

function formatSeg(total) {
  const m = Math.floor(total / 60);
  const s = Math.round(total % 60);
  return m > 0 ? `${m}:${String(s).padStart(2, "0")}` : `${s}s`;
}

// Muestra el desglose de escenas de un momento del guion.
function EscenasDelMomento({ escenas }) {
  if (!escenas || !escenas.length) return null;
  const total = escenas.reduce((a, e) => a + (Number(e.segundos) || 0), 0);
  return (
    <div style={{ marginTop: 12, borderTop: `1px dashed ${TOKENS.line}`, paddingTop: 10 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: TOKENS.inkFaint }}>
          Desglose de escenas
        </span>
        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: TOKENS.inkFaint }}>
          {formatSeg(total)}
        </span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {escenas.map((e, i) => {
          const tipo = TIPO_ESCENA[e.tipo] || { label: e.tipo || "Escena", color: TOKENS.inkSoft };
          return (
            <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 9 }}>
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 10,
                  color: TOKENS.inkFaint,
                  minWidth: 30,
                  paddingTop: 2,
                  flexShrink: 0,
                }}
              >
                {e.segundos}s
              </span>
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 9,
                  fontWeight: 600,
                  letterSpacing: "0.04em",
                  textTransform: "uppercase",
                  color: TOKENS.white,
                  background: tipo.color,
                  borderRadius: 4,
                  padding: "2px 6px",
                  flexShrink: 0,
                  whiteSpace: "nowrap",
                }}
              >
                {tipo.label}
              </span>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: TOKENS.inkSoft, lineHeight: 1.45 }}>
                {e.descripcion}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function pickSpeechVoice(index) {
  if (typeof window === "undefined" || !window.speechSynthesis) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  const esVoices = voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("es"));
  const pool = esVoices.length ? esVoices : voices;
  if (!pool.length) return null;
  return pool[index % pool.length];
}

function VozNarracion({ form, setForm }) {
  const modo = form.vozModo || "catalogo";
  const clonEstado = form.vozClonEstado || "idle";
  const [micError, setMicError] = useState(null);
  const [segundosRestantes, setSegundosRestantes] = useState(30);
  const mediaRecorderRef = useRef(null);
  const streamRef = useRef(null);
  const countdownRef = useRef(null);
  const chunksRef = useRef([]);

  const detenerStream = () => {
    if (streamRef.current) {
      streamRef.current.getTracks().forEach((t) => t.stop());
      streamRef.current = null;
    }
    if (countdownRef.current) {
      clearInterval(countdownRef.current);
      countdownRef.current = null;
    }
  };

  useEffect(() => () => detenerStream(), []);

  const startGrabacion = async () => {
    setMicError(null);
    if (typeof navigator === "undefined" || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMicError("Este navegador no permite grabar audio desde la plataforma.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;
      chunksRef.current = [];
      const recorder = new MediaRecorder(stream);
      mediaRecorderRef.current = recorder;

      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunksRef.current.push(e.data);
      };
      recorder.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: recorder.mimeType || "audio/webm" });
        const url = URL.createObjectURL(blob);
        setForm((prev) => ({ ...prev, vozClonEstado: "lista", vozClonAudioUrl: url }));
        detenerStream();
      };

      recorder.start();
      setSegundosRestantes(30);
      setForm((prev) => ({ ...prev, vozClonEstado: "grabando" }));

      countdownRef.current = setInterval(() => {
        setSegundosRestantes((s) => {
          if (s <= 1) {
            if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
              mediaRecorderRef.current.stop();
            }
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    } catch (err) {
      setMicError("No se pudo acceder al micrófono. Revisa los permisos del navegador y vuelve a intentar.");
      setForm((prev) => ({ ...prev, vozClonEstado: "idle" }));
    }
  };

  const detenerManual = () => {
    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== "inactive") {
      mediaRecorderRef.current.stop();
    }
  };

  const regrabar = () => {
    if (form.vozClonAudioUrl) URL.revokeObjectURL(form.vozClonAudioUrl);
    setForm((prev) => ({ ...prev, vozClonEstado: "idle", vozClonAudioUrl: null }));
    setMicError(null);
  };

  return (
    <div style={{ marginTop: 26 }}>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: TOKENS.inkSoft, marginBottom: 10 }}>
        Voz de narración institucional
      </div>

      <div className="ksp-row-2" style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <FormatOption
          active={modo === "catalogo"}
          title="Voces de catálogo"
          subtitle="Selección rápida de voces sintéticas institucionales."
          onClick={() => setForm({ ...form, vozModo: "catalogo" })}
        />
        <FormatOption
          active={modo === "clon"}
          title="Clonar voz del docente"
          subtitle="Graba una muestra para clonar la voz del profesor con IA."
          onClick={() => setForm({ ...form, vozModo: "clon" })}
        />
      </div>

      {modo === "catalogo" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {VOZ_CATALOGO.map((v, i) => {
            const active = form.vozCatalogoId === v.id;
            return (
              <div key={v.id} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                <button
                  onClick={() => setForm({ ...form, vozCatalogoId: v.id })}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    border: `1.5px solid ${active ? TOKENS.teal : TOKENS.line}`,
                    background: active ? "#EAF2EF" : TOKENS.white,
                    borderRadius: 7,
                    padding: "10px 14px",
                    cursor: "pointer",
                    textAlign: "left",
                  }}
                >
                  <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, fontWeight: 500, color: TOKENS.ink }}>
                    {v.label}
                  </span>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span
                      role="button"
                      tabIndex={0}
                      onClick={(e) => {
                        e.stopPropagation();
                        if (typeof window === "undefined" || !window.speechSynthesis) return;
                        window.speechSynthesis.cancel();
                        const utter = new SpeechSynthesisUtterance("Así suena esta voz de narración institucional.");
                        utter.lang = "es-MX";
                        utter.pitch = v.pitch;
                        utter.rate = v.rate;
                        const voice = pickSpeechVoice(i);
                        if (voice) utter.voice = voice;
                        window.speechSynthesis.speak(utter);
                      }}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 4,
                        fontFamily: "'Inter', sans-serif",
                        fontSize: 11,
                        fontWeight: 600,
                        color: TOKENS.teal,
                        cursor: "pointer",
                      }}
                    >
                      <Volume2 size={12} /> probar
                    </span>
                    {active && <CheckCircle2 size={15} color={TOKENS.teal} />}
                  </div>
                </button>
              </div>
            );
          })}
        </div>
      ) : (
        <div
          style={{
            border: `1.5px dashed ${TOKENS.line}`,
            borderRadius: TOKENS.radiusCard,
            padding: "24px 18px",
            textAlign: "center",
            background: TOKENS.white,
          }}
        >
          {clonEstado === "idle" && (
            <>
              <Mic size={20} color={TOKENS.stamp} />
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: TOKENS.inkSoft, margin: "10px 0 14px" }}>
                Se necesita una muestra de voz del docente para clonarla con IA institucional.
              </div>
              {micError && (
                <div
                  style={{
                    fontFamily: "'Inter', sans-serif",
                    fontSize: 11.5,
                    color: TOKENS.stamp,
                    background: "#F6E9E5",
                    border: `1px solid ${TOKENS.stamp}44`,
                    borderRadius: 6,
                    padding: "7px 11px",
                    marginBottom: 12,
                    display: "inline-block",
                  }}
                >
                  {micError}
                </div>
              )}
              <br />
              <button
                onClick={startGrabacion}
                style={{
                  background: TOKENS.teal,
                  color: TOKENS.paper,
                  border: "none",
                  borderRadius: TOKENS.radiusButton,
                  padding: "9px 16px",
                  fontFamily: "'Inter', sans-serif",
                  fontWeight: 600,
                  fontSize: 12.5,
                  cursor: "pointer",
                }}
              >
                Grabar muestra de 30s para clonación institucional por IA
              </button>
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 10.5, color: TOKENS.inkFaint, marginTop: 10 }}>
                Tu navegador pedirá permiso de micrófono. Si lo abriste dentro del chat, es posible que el permiso esté bloqueado — funciona de forma más confiable en el archivo Kapsula.html abierto directo en tu navegador.
              </div>
            </>
          )}
          {clonEstado === "grabando" && (
            <>
              <Mic size={20} color={TOKENS.stamp} style={{ animation: "pulseMic 1s ease-in-out infinite" }} />
              <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12.5, color: TOKENS.stamp, fontWeight: 600, marginTop: 10 }}>
                Grabando… 00:{String(segundosRestantes).padStart(2, "0")}
              </div>
              <button
                onClick={detenerManual}
                style={{
                  background: "transparent",
                  border: `1px solid ${TOKENS.line}`,
                  color: TOKENS.inkSoft,
                  borderRadius: 6,
                  padding: "6px 12px",
                  fontFamily: "'Inter', sans-serif",
                  fontWeight: 500,
                  fontSize: 11.5,
                  cursor: "pointer",
                  marginTop: 12,
                }}
              >
                Detener ahora
              </button>
              <style>{`@keyframes pulseMic { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }`}</style>
            </>
          )}
          {clonEstado === "lista" && (
            <>
              <CheckCircle2 size={20} color={TOKENS.teal} />
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, color: TOKENS.teal, fontWeight: 600, margin: "10px 0 10px" }}>
                Muestra grabada — lista para clonación
              </div>
              {form.vozClonAudioUrl && (
                <audio controls src={form.vozClonAudioUrl} style={{ width: "100%", maxWidth: 320, marginBottom: 12 }} />
              )}
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 10.5, color: TOKENS.inkFaint, marginBottom: 12, lineHeight: 1.5 }}>
                La grabación real ya funciona y puedes escucharla arriba. La lectura del guion con esta voz clonada requeriría conectar un servicio externo de clonación de voz, que no está integrado en este prototipo — por ahora, el video usará la voz institucional de vista previa.
              </div>
              <br />
              <button
                onClick={regrabar}
                style={{
                  background: "transparent",
                  border: `1px solid ${TOKENS.line}`,
                  color: TOKENS.inkSoft,
                  borderRadius: 6,
                  padding: "7px 14px",
                  fontFamily: "'Inter', sans-serif",
                  fontWeight: 500,
                  fontSize: 12,
                  cursor: "pointer",
                }}
              >
                Regrabar muestra
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );

                        ) : (
                          <CheckCircle2 size={13} color={TOKENS.teal} style={{ flexShrink: 0 }} />
                        )}

                            ? "Subiendo…"

                            ? "No se pudo subir"
                            : archivo.name}
                        </span>

                      <button
                        onClick={async () => {
                          if (archivo.id) {
                            try { await eliminarArchivo(archivo.id); } catch (err) { /* ignorado */ }
                          }
                          setForm((prev) => {
                            const next = { ...prev.recursoArchivos };
                            delete next[r.id];
                            return { ...prev, recursoArchivos: next };
                          });
                        }}
                        style={{ background: "transparent", border: "none", cursor: "pointer", color: TOKENS.inkFaint, flexShrink: 0 }}
                      >
                        <Trash2 size={12} />
                      </button>
                      )}
                    </div>
                  ) : (
                    <label
                      htmlFor={`recurso-file-${r.id}`}
                      style={{
                        display: "flex",
                        alignItems: "center",
                        gap: 6,
                        cursor: "pointer",
                        fontFamily: "'Inter', sans-serif",
                        fontSize: 11.5,
                        fontWeight: 600,
                        color: TOKENS.stamp,
                      }}
                    >
                      <Upload size={13} />
                      Subir archivo real
                      <input
                        id={`recurso-file-${r.id}`}
                        type="file"
                        accept="video/*,audio/*,image/*"
                        style={{ display: "none" }}
                        onChange={async (e) => {
                          const file = e.target.files && e.target.files[0];
                          e.target.value = "";
                          if (!file) return;
                          // Marca la tarjeta como "subiendo" mientras se guarda
                          setForm((prev) => ({
                            ...prev,
                            recursoArchivos: {
                              ...prev.recursoArchivos,
                              [r.id]: { name: file.name, size: file.size, subiendo: true },
                            },
                          }));
                          try {
                            const guardado = await subirArchivo(file, { recursoId: r.id, momento: r.momento });
                            setForm((prev) => ({
                              ...prev,
                              recursoArchivos: {
                                ...prev.recursoArchivos,
                                [r.id]: {
                                  id: guardado.id,
                                  name: guardado.nombre,
                                  size: guardado.tamano,
                                  tipo: guardado.tipo || file.type || "",
                                },
                              },
                            }));
                            if (!selected.includes(r.id)) toggle(r.id);
                          } catch (err) {
                            setForm((prev) => ({
                              ...prev,
                              recursoArchivos: {
                                ...prev.recursoArchivos,
                                [r.id]: { name: file.name, error: true },
                              },
                            }));
                          }
                        }}
                      />
                    </label>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <VozNarracion form={form} setForm={setForm} />
    </WizardShell>
  );
}

const DURATION_BY_FORMAT = {
  larga: { label: "06:12", seconds: 372, tag: "Cápsula" },

function vozLabel(form) {
  if (form.vozModo === "clon") {
    return form.vozClonEstado === "lista"
      ? "Voz clonada del docente — lista"
      : "Voz clonada del docente — pendiente de grabar muestra";
  }
  const v = VOZ_CATALOGO.find((x) => x.id === form.vozCatalogoId);
  return v ? v.label : "Sin voz de narración seleccionada aún";
}

// ============================================================
// Editor de línea de tiempo: asigna a cada momento del guion un
// recurso visual y una pista de audio, entre los que el profesor
// ya subió en el paso anterior.
// ============================================================
function EditorTimeline({ form, setForm, selected, carrera }) {
  const recursos = RESOURCES_BY_CARRERA[carrera] || RESOURCES_GENERICOS;
  const asignaciones = form.asignaciones || {};

  // Archivos reales que el profesor subió (con su id de almacenamiento)
  const archivosSubidos = Object.entries(form.recursoArchivos || {})
    .filter(([, a]) => a && a.id && !a.subiendo && !a.error)
    .map(([recursoId, a]) => {
      const r = recursos.find((x) => String(x.id) === String(recursoId));
      return { ...a, recursoId, momento: r ? r.momento : null, label: r ? r.label : a.name };
    });

  const setAsignacion = (momento, campo, valor) => {
    setForm((prev) => ({
      ...prev,
      asignaciones: {
        ...(prev.asignaciones || {}),
        [momento]: { ...((prev.asignaciones || {})[momento] || {}), [campo]: valor },
      },
    }));
  };

  // Algunos navegadores no reportan el tipo del archivo; en ese caso
  // se deduce por la extensión del nombre.
  const esAudio = (a) => {
    const t = (a.tipo || "").toLowerCase();
    if (t.startsWith("audio")) return true;
    if (t) return false;
    return /\.(mp3|wav|m4a|ogg|aac|webm|weba)$/i.test(a.name || "");
  };
  const esVisual = (a) => {
    const t = (a.tipo || "").toLowerCase();
    if (t.startsWith("image") || t.startsWith("video")) return true;
    if (t) return false;
    return /\.(png|jpe?g|gif|webp|svg|mp4|mov|avi|mkv)$/i.test(a.name || "");
  };

  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, fontWeight: 600, letterSpacing: "0.05em", textTransform: "uppercase", color: TOKENS.inkSoft, marginBottom: 4 }}>
        Línea de tiempo
      </div>
      <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: TOKENS.inkSoft, marginTop: 0, marginBottom: 12 }}>
        Asigna a cada momento del guion qué se ve y qué se escucha. Lo que elijas aquí se reflejará en la vista previa del video.
      </p>

      {archivosSubidos.length === 0 && (
        <div
          style={{
            fontFamily: "'Inter', sans-serif",
            fontSize: 12,
            color: TOKENS.inkSoft,
            background: TOKENS.paperDark,
            borderRadius: TOKENS.radiusControl,
            padding: "10px 13px",
            marginBottom: 12,
          }}
        >
          Todavía no has subido archivos propios. Regresa al paso de recursos y sube un audio, imagen o video en las tarjetas que dicen "Requiere grabación".
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {MOMENTOS.map((m) => {
          const asig = asignaciones[m] || {};
          const visuales = archivosSubidos.filter(esVisual);
          const audios = archivosSubidos.filter(esAudio);
          return (
            <div
              key={m}
              style={{
                border: `1px solid ${TOKENS.line}`,
                borderLeft: `4px solid ${MOMENTO_COLORS[m]}`,
                borderRadius: TOKENS.radiusControl,
                background: TOKENS.white,
                padding: "12px 14px",
              }}
            >
              <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, fontWeight: 600, color: TOKENS.ink, marginBottom: 10 }}>
                {m}
              </div>

              <div className="ksp-grid-2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {/* Carril visual */}
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 5 }}>
                    <ImageIcon size={12} color={TOKENS.inkSoft} />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: TOKENS.inkSoft }}>
                      Visual
                    </span>
                  </div>
                  <select
                    value={asig.visualId || ""}
                    onChange={(e) => setAsignacion(m, "visualId", e.target.value || null)}
                    style={{ ...inputStyle, padding: "7px 9px", fontSize: 12.5, cursor: "pointer" }}
                  >
                    <option value="">Fondo institucional</option>
                    {visuales.map((a) => (
                      <option key={a.id} value={a.id}>
                        {a.name}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Carril de audio */}
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 5 }}>
                    <Volume2 size={12} color={TOKENS.inkSoft} />
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase", color: TOKENS.inkSoft }}>
                      Audio
                    </span>
                  </div>
                  <select
                    value={asig.audioId || ""}
                    onChange={(e) => setAsignacion(m, "audioId", e.target.value || null)}
                    style={{ ...inputStyle, padding: "7px 9px", fontSize: 12.5, cursor: "pointer" }}
                  >
                    <option value="">Narración generada</option>
                    {audios.map((a) => (
                      <option key={a.id} value={a.id}>
                        {a.name}
                      </option>
                    ))}
                  </select>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

    const cuerpo = JSON.stringify({

    if (!response || !response.ok) {
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: cuerpo,
      });
    }
    if (!response.ok) throw new Error(`status ${response.status}`);
    const data = await response.json();
    const textBlock = (data.content || []).find((b) => b.type === "text");
    if (!textBlock || !textBlock.text) throw new Error("respuesta vacía");

    // Extrae solo el bloque {...} aunque la IA agregue texto extra alrededor
    const raw = textBlock.text.replace(/```json|```/g, "").trim();
    const match = raw.match(/\{[\s\S]*\}/);
    const jsonText = match ? match[0] : raw;
    const parsed = JSON.parse(jsonText);

    if (!parsed.gancho || !parsed.explicacion || !parsed.aplicacion || !parsed.accion) {
      throw new Error("formato incompleto");
    }
    return parsed;

        return;
      } catch (err) {
        if (intento < MAX_INTENTOS) {

    }

function Gauge({ value, min = 0, max = 100, target = [60, 70] }) {
  const angle = (value / max) * 180;
  return (
    <div style={{ position: "relative", width: 180, height: 100 }}>
      <svg viewBox="0 0 180 100" width="180" height="100">
        <path d="M 10 95 A 80 80 0 0 1 170 95" fill="none" stroke={TOKENS.line} strokeWidth="14" strokeLinecap="round" />
        <path
          d={`M ${10 + 160 * (target[0] / 100)} ${95 - Math.sin((Math.PI * target[0]) / 100) * 0} `}
          fill="none"
        />
        <path
          d="M 10 95 A 80 80 0 0 1 170 95"
          fill="none"
          stroke={TOKENS.brassLight}
          strokeWidth="14"
          strokeLinecap="butt"
          strokeDasharray={`${(target[1] - target[0]) * 2.5} 500`}
          strokeDashoffset={-(target[0] * 2.5)}
        />
        <line
          x1="90"
          y1="95"
          x2={90 + 68 * Math.cos(Math.PI - (Math.PI * angle) / 180)}
          y2={95 - 68 * Math.sin(Math.PI - (Math.PI * angle) / 180)}
          stroke={TOKENS.ink}
          strokeWidth="3"
          strokeLinecap="round"
        />
        <circle cx="90" cy="95" r="5" fill={TOKENS.ink} />
      </svg>
      <div
        style={{
          position: "absolute",
          bottom: 0,
          left: 0,
          right: 0,
          textAlign: "center",
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 22,
          fontWeight: 600,
          color: TOKENS.ink,
        }}
      >
        {value}
      </div>
    </div>
  );
}

        dbSeedIfEmpty("evidencia", EVIDENCE_LOG_SEED),

      // APRENDIZAJE — única categoría que cuenta como impacto andragógico.

      const pendientes = evidencias.filter((e) => e.estado === "pendiente").length;
      const pctValidadas = total > 0 ? Math.round((validadas / total) * 100) : 0;

        total,
        validadas,
        pendientes,
        pctValidadas,
        pctConsumo,

function Competencias({ session }) {
  const [evidencias, setEvidencias] = useState(null);
  const [error, setError] = useState(null);
  const [procesando, setProcesando] = useState(null);

  const cargarEvidencias = async () => {
    setError(null);
    setEvidencias(null);
    try {
      const data = await dbSeedIfEmpty("evidencia", EVIDENCE_LOG_SEED);
      data.sort((a, b) => {
        // Pendientes primero: son las que requieren acción del profesor.
        const pa = a.estado === "pendiente" ? 0 : 1;
        const pb = b.estado === "pendiente" ? 0 : 1;
        if (pa !== pb) return pa - pb;
        return (b._fecha || 0) - (a._fecha || 0);
      });
      setEvidencias(data);
    } catch (err) {
      setError("No se pudo cargar el registro de evidencia. Intenta de nuevo.");
    }
  };

  // Valida o rechaza una evidencia y lo guarda de verdad.
  const validarEvidencia = async (evidencia, nuevoEstado) => {
    setProcesando(evidencia.id);
    try {
      const actualizada = {
        ...evidencia,
        estado: nuevoEstado,
        validadaPor: session ? session.nombre : "Profesor",
        _validadaEn: Date.now(),
        motivo: nuevoEstado === "rechazada" ? "El profesor solicitó ampliar la justificación." : undefined,
      };
      await dbPut("evidencia", actualizada);
      setEvidencias((prev) => (prev || []).map((e) => (e.id === evidencia.id ? actualizada : e)));
    } catch (err) {
      setError("No se pudo guardar la validación. Intenta de nuevo.");
    } finally {
      setProcesando(null);
    }
  };

  useEffect(() => {
    cargarEvidencias();
  }, []);

  return (
    <div className="ksp-page" style={{ padding: "36px 44px", width: "100%", maxWidth: 940 }}>
      <h1 className="ksp-h1" style={{ fontFamily: "'Sora', sans-serif", fontSize: 30, fontWeight: 600, color: TOKENS.ink, margin: 0 }}>
        Evidencia y competencias
      </h1>
      <p style={{ fontFamily: "'Inter', sans-serif", fontSize: 13.5, color: TOKENS.inkSoft, marginTop: 6, marginBottom: 26 }}>
        Cómo la interacción del alumno se convierte en evidencia, y la evidencia en competencia validada.
      </p>

      <div style={{ background: TOKENS.white, border: `1px solid ${TOKENS.line}`, borderRadius: TOKENS.radiusCard, boxShadow: TOKENS.shadowCard, overflowX: "auto", marginBottom: 28 }}>
        <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1.3fr 1.3fr 1.1fr", background: TOKENS.paperDark, minWidth: 600 }}>
          {["Cápsula", "Interacción", "Evidencia generada", "Competencia validada"].map((h) => (
            <div
              key={h}
              style={{
                padding: "10px 14px",
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: 10,
                fontWeight: 600,
                letterSpacing: "0.05em",
                textTransform: "uppercase",
                color: TOKENS.inkSoft,
              }}
            >
              {h}
            </div>
          ))}
        </div>
        {COMPETENCY_MATRIX.map((row, i) => (
          <div
            key={row.capsula}
            style={{
              display: "grid",
              gridTemplateColumns: "1.1fr 1.3fr 1.3fr 1.1fr",
              minWidth: 600,
              borderTop: `1px solid ${TOKENS.line}`,
              background: i % 2 === 1 ? "#FAF8F1" : TOKENS.white,
            }}
          >
            <div style={{ padding: "12px 14px", fontFamily: "'Inter', sans-serif", fontSize: 12.5, fontWeight: 600, color: TOKENS.ink }}>
              {row.capsula}
            </div>
            <div style={{ padding: "12px 14px", fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: TOKENS.inkSoft, lineHeight: 1.45 }}>
              {row.interaccion}
            </div>
            <div style={{ padding: "12px 14px", fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: TOKENS.inkSoft, lineHeight: 1.45 }}>
              {row.evidencia}
            </div>
            <div style={{ padding: "12px 14px" }}>
              <span
                style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: 10.5,
                  fontWeight: 600,
                  color: TOKENS.teal,
                  background: "#EAF2EF",
                  border: `1px solid ${TOKENS.teal}55`,
                  borderRadius: 4,
                  padding: "3px 7px",
                  display: "inline-block",
                  lineHeight: 1.3,
                }}
              >
                {row.competencia}
              </span>
            </div>
          </div>
        ))}
      </div>

      <h2 style={{ fontFamily: "'Sora', sans-serif", fontSize: 18, fontWeight: 600, color: TOKENS.ink, margin: "0 0 12px 0" }}>
        Registro de evidencia por alumno
      </h2>
      {evidencias === null && !error && <LoadingState label="Cargando registro de evidencia…" />}
      {error && <ErrorState message={error} onRetry={cargarEvidencias} />}
      {evidencias && (
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {evidencias.length === 0 && (
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: TOKENS.inkFaint, padding: "16px 0" }}>
            Todavía no hay evidencias entregadas.
          </div>
        )}
        {evidencias.map((e, i) => (
          <div
            key={e.id || i}
            style={{
              background: TOKENS.white,
              border: `1px solid ${TOKENS.line}`,
              borderRadius: TOKENS.radiusCard,
              padding: "12px 16px",
              display: "flex",
              alignItems: "center",
              justifyContent: "space-between",
              gap: 14,
              flexWrap: "wrap",
            }}
          >
            <div style={{ display: "flex", flexDirection: "column", gap: 2, minWidth: 220, flex: 1 }}>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 13, fontWeight: 600, color: TOKENS.ink }}>
                {e.alumno} <span style={{ fontWeight: 400, color: TOKENS.inkFaint }}>· {e.capsula}</span>
              </span>
              <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 12, color: TOKENS.inkSoft }}>{e.evidencia}</span>
              {e.estado === "rechazada" && e.motivo && (
                <span style={{ fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: TOKENS.stamp, marginTop: 2 }}>
                  Motivo: {e.motivo}
                </span>
              )}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              {e.estado === "pendiente" ? (
                <>
                  <button
                    onClick={() => validarEvidencia(e, "validada")}
                    disabled={procesando === e.id}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 5,
                      background: TOKENS.teal,
                      color: TOKENS.white,
                      border: "none",
                      borderRadius: TOKENS.radiusButton,
                      padding: "7px 13px",
                      fontFamily: "'Inter', sans-serif",
                      fontWeight: 600,
                      fontSize: 11.5,
                      cursor: procesando === e.id ? "default" : "pointer",
                      opacity: procesando === e.id ? 0.6 : 1,
                    }}
                  >
                    <CheckCircle2 size={12} /> Validar
                  </button>
                  <button
                    onClick={() => validarEvidencia(e, "rechazada")}
                    disabled={procesando === e.id}
                    style={{
                      background: "transparent",
                      color: TOKENS.stamp,
                      border: `1px solid ${TOKENS.stamp}55`,
                      borderRadius: TOKENS.radiusButton,
                      padding: "7px 13px",
                      fontFamily: "'Inter', sans-serif",
                      fontWeight: 600,
                      fontSize: 11.5,
                      cursor: procesando === e.id ? "default" : "pointer",
                      opacity: procesando === e.id ? 0.6 : 1,
                    }}
                  >
                    Requiere corrección
                  </button>
                </>
              ) : (
                <span
                  style={{
                    fontFamily: "'JetBrains Mono', monospace",
                    fontSize: 10,
                    fontWeight: 600,
                    letterSpacing: "0.05em",
                    textTransform: "uppercase",
                    color: e.estado === "validada" ? TOKENS.teal : TOKENS.stamp,
                    background: e.estado === "validada" ? "#EAF2EF" : "#F6E9E5",

                  }}
                >
                  {e.estado === "validada" ? "Validada" : "Requiere corrección"}
                </span>
              )}
            </div>
          </div>
        ))}
      </div>
      )}
    </div>
  );
}
